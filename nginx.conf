server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probed by the Deployment. Kept separate from / so a broken index cannot mask a
    # healthy pod, and vice versa.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
