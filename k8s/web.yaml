# What actually runs. This file is the source of truth: Flux applies it, so the cluster
# matches the repo and nothing is configured by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monke-app
  labels: { app: monke-app }
spec:
  replicas: 2
  # Spelled out rather than left to the defaults, because the namespace quota makes the
  # surge size load-bearing: one extra pod fits, two would not.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: monke-app }
  template:
    metadata:
      labels: { app: monke-app }
    spec:
      # One replica per node, so losing a node cannot take the app down.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: monke-app }
              topologyKey: kubernetes.io/hostname
      # Only needed if the GHCR package is private; without it the pull fails 401 and the
      # pod sits in ImagePullBackOff. Delete these lines if the package is public.
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: app
          # CI rewrites this tag on every push. Never `:latest` — the tag is how rollback
          # works, and a moving tag means a restarted pod silently changes version.
          image: ghcr.io/monkecloud/monke-app:7c5f01b
          ports:
            - containerPort: 8080
          # Readiness is what pulls a pod out of the Service's endpoints; without it a
          # starting or wedged replica still receives traffic.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            # Trimmed from 500m/512Mi to fit the api alongside this: the namespace caps
            # summed limits at 2 CPU, and a rolling update needs one pod of headroom on
            # top of that. nginx serving a static bundle is nowhere near this ceiling.
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: monke-app
spec:
  selector: { app: monke-app }
  ports:
    - port: 80
      targetPort: 8080
---
# Required by the two-replica pattern: without it a node drain can take both replicas at
# once. Drop it if you ever run a single replica, where minAvailable: 1 blocks every drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: monke-app
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: monke-app }
