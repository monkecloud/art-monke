# The Rust/axum backend. Same shape as web.yaml: Flux applies this, so the cluster matches
# the repo and nothing is configured by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monke-app-api
  labels: { app: monke-app-api }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: monke-app-api }
  template:
    metadata:
      labels: { app: monke-app-api }
    spec:
      # One replica per node, so losing a node cannot take the api down.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: monke-app-api }
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: api
          # CI rewrites this tag on every push, to the same tag web.yaml gets — both images
          # are built from the commit they are tagged with.
          image: ghcr.io/monkecloud/art-monke/api:1f879b6
          ports:
            - containerPort: 8080
          # Postgres, as libpq variables rather than one URL. The credential is the
          # owner's role, unchanged and shared; what is this app's own is the database.
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef: { name: yarn-pg, key: host }
            - name: PGPORT
              valueFrom:
                secretKeyRef: { name: yarn-pg, key: port }
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: yarn-pg, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: yarn-pg, key: password }
            # This app's own database: monke_app in prod, monke_app_dev in dev. The
            # ConfigMap is applied per namespace by the infra repo, so this line is
            # identical on both branches and there is no overlay patch to misfire. That
            # matters: the `uri`/`uri_dev` patch is keyed to the monke-app Deployment by
            # name, so it would never have reached this one, and dev would have written to
            # the production database in silence.
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef: { name: monke-app-db, key: database }
            # The bucket-scoped Garage credentials this app's own key can read/write. The
            # `endpoint` key (not `endpoint_external`) is the in-cluster one: the api talks
            # to Garage itself rather than handing a URL to the browser, since Garage has no
            # public Ingress.
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef: { name: monke-app-garage, key: endpoint }
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef: { name: monke-app-garage, key: bucket }
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: monke-app-garage, key: access_key }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: monke-app-garage, key: secret_key }
            # Transcode progress, which the worker writes and /api/audio/{id}/progress streams
            # out. Read-only as far as this pod is concerned, and never load-bearing: every
            # read degrades to "no percentage yet" if the cache is down. Host and port are
            # constants in the code, like S3_REGION — this repo's own redis.yaml sets them.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: monke-app-redis, key: password }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: monke-app-api
spec:
  selector: { app: monke-app-api }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: monke-app-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: monke-app-api }
