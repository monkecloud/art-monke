# Public exposure. cert-manager sees this Ingress and issues the certificate itself.
#
# The hostname here is the production one on BOTH branches. The cluster's dev overlay
# patches it to the dev hostname when it applies this repo into the dev namespace, which is
# what keeps the two branches byte-identical and every dev -> master merge conflict-free.
#
# Renaming this Ingress silently breaks renewal: the Certificate is owned by the Ingress
# that requested it, so deleting one garbage-collects the Certificate while the TLS Secret
# survives, and a new Ingress refuses to adopt it. After any rename, delete the orphaned
# Secret too and let cert-manager reissue.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monke-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [app.monke.ca]
      secretName: monke-app-tls
  rules:
    - host: app.monke.ca
      http:
        paths:
          # /api first for readability; Traefik matches the longer prefix regardless of
          # order. The prefix is NOT stripped, so the api serves its routes under /api
          # rather than needing a rewrite middleware.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: monke-app-api
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monke-app
                port: { number: 80 }
