server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probed by the Deployment. Kept separate from / so a broken index cannot mask a
    # healthy pod, and vice versa.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these filenames, so a given URL's contents never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths are client-side routes, not 404s. index.html itself must
    # never be cached, or browsers keep loading the old build's asset URLs after a deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
